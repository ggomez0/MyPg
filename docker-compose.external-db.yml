services:
  api:
    build:
      context: .
      dockerfile: ./packages/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-4040}:${API_PORT:-4040}"
    env_file:
      - .env
    environment:
      API_PORT: ${API_PORT:-4040}
      INTERNAL_DATABASE_URL: ${INTERNAL_DATABASE_URL:-postgresql://postgres:PgSec2026_Postgres_AdminKey!@postgres-main:5432/mypg_internal}
      DATA_DATABASE_URL: ${DATA_DATABASE_URL:-postgresql://postgres:PgSec2026_Postgres_AdminKey!@postgres-main:5432/mypg_data}
    networks:
      - default
      - postgres_default
    volumes:
      - uploads:/app/uploads
      - /var/lib/docker/containers/2447d76ed610c3b42a34dec132810956db2d3c7156c41a3a0ac957e07166df30/2447d76ed610c3b42a34dec132810956db2d3c7156c41a3a0ac957e07166df30-json.log:/var/log/postgres/postgres.log:ro

  dashboard:
    build:
      context: .
      dockerfile: ./packages/dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3030}:3000"
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: http://api:${API_PORT:-4040}
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - api
    networks:
      - default

networks:
  postgres_default:
    external: true

volumes:
  uploads:
